ion>openai/gpt-4o</option><option>anthropic/claude-3.5-sonnet</option><option>google/gemini-2.0-flash-001</option></select></div><p><button id="run" class="on">run battle</button> <button id="clear">clear key</button></p><p id="prog" class="mut"></p><div id="scores"></div><div id="details"></div></section></main><script>const N='\n',S={products:[{id:'P1',model:'Horus 400',family:'Horus',clinical_use:'videodermatoscopy',active:true,price:null,product_code:'113803'},{id:'P2',model:'Horus 600',family:'Horus',clinical_use:'capillaroscopy',active:true,product_code:113803},{id:'P3',model:'Horus 800',family:'Horus',clinical_use:'videodermatoscopy',active:false,product_code:'null'},{id:'P4',model:'KolpoView X',family:'KolpoView',clinical_use:'colposcopy',active:true,distributor:'Meditalia'}],claims:[{source:'catalog.md',section:'Families',score:.91,claim:'Horus models share one family across multiple clinical uses.',evidence:'Horus 400, 600 and 800 share the Horus family field.'},{source:'seo.md',section:'Intent',score:.87,claim:'Clinical use should be explicit in page copy.',evidence:'Capillaroscopy and dermatoscopy map to different search intents.'},{source:'pricing.md',section:'Missing',score:.31,claim:'No warranty duration is provided in this payload.'}],timeline:[{date:'2026-05-11',time:'09:10',event:'issue reported',actor:'guest'},{date:'2026-05-11',time:'18:32',event:'maintenance escalation',actor:'host'},{date:'2026-05-12',time:'08:40',event:'issue still unresolved',actor:'guest'}],config:{market:'EU',language:'it',benchmark:true}},Q=[['Return the active videodermatoscopy models.',['Horus 400'],'set'],['Return active product models ordered by product id.',['Horus 400','Horus 600','KolpoView X'],'ordered_set'],['Which product model has product_code as the number 113803, not a string?','Horus 600','exact'],['Which product model has product_code as the string null?','Horus 800','exact'],['Which evidence source has the highest score?','catalog.md','exact'],['What event happened after maintenance escalation?','issue still unresolved','contains'],['What warranty duration is specified?','not provided','absent'],["Is the claim 'KolpoView belongs to the Horus family' supported by the payload?",'unsupported','unsupported']],$=id=>document.getElementById(id),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),sch=rs=>[...new Set(rs.flatMap(r=>Object.keys(r)))],tok=s=>Math.max(1,Math.round(s.length/4)),csv=v=>/[,"|\n]/.test(String(v))?'"'+String(v).replaceAll('"','""')+'"':String(v),row=a=>a.map(csv).join(',');function jl(s){return s===''||['null','true','false'].includes(s)||(s.trim()===s&&Number.isFinite(Number(s)))}function cell(v){return typeof v!=='string'?JSON.stringify(v):(jl(v)||v[0]==='$'||v.includes('|')?'$'+v.replaceAll('\\','\\\\').replaceAll('|','\\|'):v)}function prim(v){return v===null?'null':['string','number','boolean'].includes(typeof v)?String(v):JSON.stringify(v)}function typ(rs,k){return[...new Set(rs.filter(r=>has(r,k)).map(r=>r[k]===null?'null':typeof r[k]))]}function tag(k,rs){let t=typ(rs,k);return k==='id'||k.endsWith('_id')?'id':t.length!==1?'mixed':t[0]==='boolean'?'bool':t[0]==='number'?'num':t[0]==='null'?'null':'str'}function risky(rs){return sch(rs).filter(k=>typ(rs,k).length!==1||rs.some(r=>typeof r[k]==='string'&&jl(r[k])))}function lean(root,rs){let c=sch(rs);return root+'['+row(c)+']:'+N+rs.map(r=>'|'+row(c.map(k=>has(r,k)?prim(r[k]):''))).join(N)}function kv(root,rs,hints){let c=sch(rs),h=hints?risky(rs).map(k=>k+':'+tag(k,rs)).join(','):'';return root+'!kv['+row(c)+']'+(h?'{'+h+'}':'')+':'+N+rs.map(r=>'|'+Object.keys(r).map(k=>k+'='+cell(r[k])).join('|')).join(N)}function rag(rs){let src=c=>c.source||c.src||'';return ['ctx[id,src,sec,score]:',...rs.map((c,i)=>'|'+row([i+1,src(c),c.section||'',c.score??''])),...rs.map((c,i)=>'c'+(i+1)+'[src='+src(c)+']:'+(c.claim||'')),...rs.flatMap((c,i)=>c.evidence?['e'+(i+1)+'[src='+src(c)+']:'+c.evidence]:[])].join(N)}function block(root,rs){let c=sch(rs),cells=rs.length*Math.max(c.length,1),p=rs.reduce((a,r)=>a+Object.keys(r).length,0),amb=rs.some(r=>Object.values(r).some(v=>typeof v==='string'&&jl(v))),sparse=cells?1-p/cells:0,g=$('goal').value;if(g==='token-first')return lean(root,rs);if(g==='exact-first'||g==='hallucination-safe'||sparse>=.5||amb)return kv(root,rs,amb);return lean(root,rs)}function hybrid(v){let b=[],sc=[];for(let[k,x]of Object.entries(v)){if(Array.isArray(x)&&x.every(y=>y&&typeof y==='object'&&!Array.isArray(y)))b.push(x.some(y=>'claim'in y||'evidence'in y)?rag(x):block(k,x));else if(x&&typeof x==='object'&&!Array.isArray(x))b.push(k+':'+Object.entries(x).map(([a,z])=>a+'='+prim(z)).join('|'));else sc.push(k+'='+prim(x))}if(sc.length)b.push(sc.join('|'));let body=b.join(N+N);return body.includes('$')?'@types $=string -=absent ~=empty'+N+N+body:body}function forms(){let v=JSON.parse($('raw').value);return[{id:'json',name:'Min JSON',text:JSON.stringify(v),parity:'JSON-model'},{id:'hybrid',name:'SCD Hybrid Naked',text:hybrid(v),parity:'task-oriented'}]}function norm(v){return (v&&typeof v==='object'?JSON.stringify(v):String(v??'')).toLowerCase().replace(/["'`.]/g,' ').replace(/\s+/g,' ').trim()}function tj(v){if(v&&typeof v==='object')return v;try{return JSON.parse(String(v??'').trim())}catch{return null}}function item(x){return x&&typeof x==='object'?norm(x.statement??x.claim??x.text??x.model??x.id??x.source??JSON.stringify(x)):norm(x)}function list(v){let j=tj(v);if(Array.isArray(j))return j.map(item).filter(Boolean);if(j&&typeof j==='object')return[item(j)];return norm(v).replaceAll(' and ',',').split(/[,;|\n]/).map(x=>x.trim()).filter(Boolean)}function mi(a,e){return a===e||a.includes(e)||e.includes(a)}function same(a,e,o){let A=list(a),E=list(e);if(A.length!==E.length)return false;if(o)return E.every((x,i)=>mi(A[i]||'',x));let u=new Set;return E.every(x=>{let i=A.findIndex((y,j)=>!u.has(j)&&mi(y,x));if(i<0)return false;u.add(i);return true})}function score(a,e,m){let A=norm(a),E=norm(e);if(m==='contains')return A.includes(E)||E.includes(A);if(m==='absent')return A===''||['none','null','not provided','not specified','absent','missing','unknown'].some(x=>A===x||A.includes(x));if(m==='unsupported')return['unsupported','not supported','no evidence','cannot determine','false','no'].some(x=>A===x||A.includes(x));if(m==='set')return same(a,e,0);if(m==='ordered_set')return same(a,e,1);return A===E||item(tj(a))===E}async function ask(key,model,f,q){let hint=q[2]==='set'||q[2]==='ordered_set'?'Return only requested values as an array of strings.':'Return only the final answer.';let prompt=`Use ONLY the provided data. Do not infer absent values. Do not invent fields.${N}${hint}${N}${N}FORMAT: ${f.name}${N}DATA:${N}${f.text}${N}${N}QUESTION: ${q[0]}${N}${N}Return ONLY JSON: {"answer":...}`;let r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json','X-Title':'SCD Arena Mobile'},body:JSON.stringify({model,temperature:0,messages:[{role:'user',content:prompt}]})});if(!r.ok)throw new Error(await r.text());let c=(await r.json())?.choices?.[0]?.message?.content||'';try{return JSON.parse(c.replace('```json','').replace('```','').trim()).answer}catch{return c}}let active='hybrid',battle=[];function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){try{JSON.parse($('raw').value);$('status').textContent='valid JSON';$('status').className='ok'}catch(e){$('status').textContent=e.message;$('status').className='bad';return}let fs=forms(),jt=tok(fs[0].text),f=fs.find(x=>x.id===active)||fs[0];$('cards').innerHTML=fs.map(x=>`<button data-f="${x.id}" class="${active===x.id?'cy':''}"><b>${x.name}</b><div class="mut">${tok(x.text)} tok · ${((1-tok(x.text)/jt)*100).toFixed(1)}% · ${x.parity}</div></button>`).join('');$('pre').textContent=f.text;renderBattle()}function renderBattle(){battle.sort((a,b)=>b.correct/b.total-a.correct/a.total||a.tokens-b.tokens);$('scores').innerHTML=battle.length?'<table>'+battle.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.correct}/${r.total}</td><td>${r.tokens}</td></tr>`).join('')+'</table>':'';$('details').innerHTML=battle.map(r=>`<div class="p"><b>${r.name} ${r.correct}/${r.total}</b>${r.details.map((d,i)=>`<p class="mut">Q${i+1} ${d.q[2]}: ${esc(d.q[0])}</p><p class="${d.ok?'ok':'bad'}">A: ${esc(JSON.stringify(d.answer))}</p>`).join('')}</div>`).join('')}async function run(){let key=$('key').value.trim();if(!key)return;sessionStorage.setItem('OPENROUTER_API_KEY',key);battle=[];renderBattle();$('run').disabled=1;try{for(let f of forms()){let correct=0,details=[];for(let i=0;i<Q.length;i++){let q=Q[i];$('prog').textContent=f.name+' · Q'+(i+1)+'/'+Q.length;let answer='';try{answer=await ask(key,$('model').value,f,q)}catch(e){answer='ERROR: '+e.message}let ok=score(answer,q[1],q[2]);if(ok)correct++;details.push({q,answer,ok})}battle.push({name:f.name,correct,total:Q.length,tokens:tok(f.text),details});renderBattle()}}finally{$('run').disabled=0;$('prog').textContent=''}}$('raw').value=JSON.stringify(S,null,2);$('key').value=sessionStorage.getItem('OPENROUTER_API_KEY')||'';document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');['in','out','bat'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.t));render()});$('cards').onclick=e=>{let b=e.target.closest('[data-f]');if(b){active=b.dataset.f;render()}};$('raw').oninput=render;$('goal').onchange=render;$('sample').onclick=()=>{$('raw').value=JSON.stringify(S,null,2);render()};$('run').onclick=run;$('clear').onclick=()=>{sessionStorage.removeItem('OPENROUTER_API_KEY');$('key').value=''};render();</script>
