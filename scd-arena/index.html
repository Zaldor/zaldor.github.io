<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCD Arena Mobile</title><style>body{margin:0;background:#09090b;color:#f4f4f5;font-family:ui-monospace,monospace}header{position:sticky;top:0;background:#09090bee;border-bottom:1px solid #3f3f46;padding:12px;z-index:2}main{max-width:980px;margin:auto;padding:12px}.title{font-weight:900;letter-spacing:.1em}.panel{border:1px solid #3f3f46;background:#18181bcc;border-radius:14px;padding:12px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}button,input,select,textarea{font:inherit;border:1px solid #3f3f46;background:#050506;color:#f4f4f5;border-radius:10px;padding:10px}button{cursor:pointer}.on{border-color:#bef264;color:#bef264}.cyan{border-color:#67e8f9;color:#67e8f9}textarea{width:100%;min-height:45vh;font-size:12px}pre{white-space:pre-wrap;word-break:break-word;background:#050506;border-radius:12px;padding:12px;min-height:45vh;overflow:auto;font-size:12px}.mut{color:#a1a1aa;font-size:12px}.ok{color:#bef264}.bad{color:#fb7185}table{width:100%;border-collapse:collapse;font-size:12px}td{border-bottom:1px solid #27272a;padding:8px}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="title">SCD ARENA MOBILE</div><div class="mut">GitHub Pages lite · JSON vs SCD Hybrid · OpenRouter battle</div></header><main><section class="panel row"><button data-tab="input" class="on">input</button><button data-tab="output">output</button><button data-tab="battle">battle</button><select id="goal"><option>balanced</option><option>token-first</option><option>hallucination-safe</option><option>exact-first</option></select></section><section id="input" class="panel"><div class="row"><button id="sample" class="on">load sample</button><span id="status" class="mut"></span></div><textarea id="raw" spellcheck="false"></textarea></section><section id="output" class="panel hide"><div id="cards" class="grid"></div><pre id="out"></pre></section><section id="battle" class="panel hide"><div class="grid"><input id="key" type="password" placeholder="OpenRouter API key"><select id="model"><option>openai/gpt-4o-mini</option><option>openai/gpt-4o</option><option>anthropic/claude-3.5-sonnet</option><option>google/gemini-2.0-flash-001</option></select></div><div class="row" style="margin-top:8px"><button id="run" class="on">run battle</button><button id="clear">clear key</button></div><p id="prog" class="mut"></p><div id="scores"></div><div id="details"></div></section></main><script>const NL='\n',S={products:[{id:'P1',model:'Horus 400',family:'Horus',clinical_use:'videodermatoscopy',active:true,price:null,product_code:'113803'},{id:'P2',model:'Horus 600',family:'Horus',clinical_use:'capillaroscopy',active:true,product_code:113803},{id:'P3',model:'Horus 800',family:'Horus',clinical_use:'videodermatoscopy',active:false,product_code:'null'},{id:'P4',model:'KolpoView X',family:'KolpoView',clinical_use:'colposcopy',active:true,distributor:'Meditalia'}],claims:[{source:'catalog.md',section:'Families',score:.91,claim:'Horus models share one family across multiple clinical uses.',evidence:'Horus 400, 600 and 800 share the Horus family field.'},{source:'seo.md',section:'Intent',score:.87,claim:'Clinical use should be explicit in page copy.',evidence:'Capillaroscopy and dermatoscopy map to different search intents.'},{source:'pricing.md',section:'Missing',score:.31,claim:'No warranty duration is provided in this payload.'}],timeline:[{date:'2026-05-11',time:'09:10',event:'issue reported',actor:'guest'},{date:'2026-05-11',time:'18:32',event:'maintenance escalation',actor:'host'},{date:'2026-05-12',time:'08:40',event:'issue still unresolved',actor:'guest'}],config:{market:'EU',language:'it',benchmark:true}},Q=[['Return the active videodermatoscopy models.',['Horus 400'],'set'],['Return active product models ordered by product id.',['Horus 400','Horus 600','KolpoView X'],'ordered_set'],['Which product model has product_code as the number 113803, not a string?','Horus 600','exact'],['Which product model has product_code as the string null?','Horus 800','exact'],['Which evidence source has the highest score?','catalog.md','exact'],['What event happened after maintenance escalation?','issue still unresolved','contains'],['What warranty duration is specified?','not provided','absent'],["Is the claim 'KolpoView belongs to the Horus family' supported by the payload?",'unsupported','unsupported']];const $=id=>document.getElementById(id),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),schema=rs=>[...new Set(rs.flatMap(r=>Object.keys(r)))],tok=s=>Math.max(1,Math.round(s.length/4)),csv=v=>/[",|\n]/.test(String(v))?'"'+String(v).replaceAll('"','""')+'"':String(v),row=xs=>xs.map(csv).join(',');function jlike(s){return s===''||['null','true','false'].includes(s)||(s.trim()===s&&Number.isFinite(Number(s)))}function cell(v){if(typeof v!=='string')return JSON.stringify(v);return jlike(v)||v.startsWith('$')||v.includes('|')?'$'+v.replaceAll('\\','\\\\').replaceAll('|','\\|'):v}function prim(v){return v===null?'null':['string','number','boolean'].includes(typeof v)?String(v):JSON.stringify(v)}function tag(k,rs){let vs=rs.filter(r=>has(r,k)).map(r=>r[k]),ts=[...new Set(vs.map(v=>v===null?'null':typeof v))];return k==='id'||k.endsWith('_id')?'id':ts.length!==1?'mixed':ts[0]==='boolean'?'bool':ts[0]==='number'?'num':ts[0]}function lean(root,rs){let c=schema(rs);return root+'['+row(c)+']:'+NL+rs.map(r=>'|'+row(c.map(k=>has(r,k)?prim(r[k]):''))).join(NL)}function kv(root,rs,typed){let c=schema(rs),h=typed?c.map(k=>k+':'+tag(k,rs)):c;return root+'!kv['+row(h)+']:'+NL+rs.map(r=>'|'+Object.keys(r).map(k=>k+'='+cell(r[k])).join('|')).join(NL)}function rag(rs){let src=c=>c.source||c.src||'';return ['ctx[id,src,sec,score]:',...rs.map((c,i)=>'|'+row([i+1,src(c),c.section||'',c.score??''])),...rs.map((c,i)=>'c'+(i+1)+'[src='+src(c)+']:'+(c.claim||'')),...rs.flatMap((c,i)=>c.evidence?['e'+(i+1)+'[src='+src(c)+']:'+c.evidence]:[])].join(NL)}function block(root,rs){let c=schema(rs),cells=rs.length*Math.max(c.length,1),present=rs.reduce((a,r)=>a+Object.keys(r).length,0),amb=rs.some(r=>Object.values(r).some(v=>typeof v==='string'&&jlike(v))),sparse=cells?1-present/cells:0,goal=$('goal').value;if(goal==='token-first')return lean(root,rs);if(goal==='exact-first'||goal==='hallucination-safe'||sparse>=.5||amb)return kv(root,rs,amb);return lean(root,rs)}function hybrid(v){let bs=[],sc=[];for(let[k,sub]of Object.entries(v)){if(Array.isArray(sub)&&sub.every(x=>x&&typeof x==='object'&&!Array.isArray(x)))bs.push(sub.some(x=>'claim'in x||'evidence'in x)?rag(sub):block(k,sub));else if(sub&&typeof sub==='object'&&!Array.isArray(sub))bs.push(k+':'+Object.entries(sub).map(([a,b])=>a+'='+prim(b)).join('|'));else sc.push(k+'='+prim(sub))}if(sc.length)bs.push(sc.join('|'));let body=bs.join(NL+NL);return body.includes('$')?'@types $=string -=absent ~=empty'+NL+NL+body:body}function forms(){let v=JSON.parse($('raw').value);return[{id:'json',name:'Min JSON',text:JSON.stringify(v),parity:'JSON-model'},{id:'hybrid',name:'SCD Hybrid Naked',text:hybrid(v),parity:'task-oriented'}]}function norm(v){return (v&&typeof v==='object'?JSON.stringify(v):String(v??'')).toLowerCase().replace(/["'`.]/g,' ').replace(/\s+/g,' ').trim()}function tj(v){if(v&&typeof v==='object')return v;try{return JSON.parse(String(v??'').trim())}catch{return null}}function item(x){return x&&typeof x==='object'?norm(x.statement??x.claim??x.text??x.model??x.id??x.source??JSON.stringify(x)):norm(x)}function list(v){let j=tj(v);if(Array.isArray(j))return j.map(item).filter(Boolean);if(j&&typeof j==='object')return[item(j)];return norm(v).replaceAll(' and ',',').split(/[,;|\n]/).map(x=>x.trim()).filter(Boolean)}function mi(a,e){return a===e||a.includes(e)||e.includes(a)}function same(a,e,ord){let A=list(a),E=list(e);if(A.length!==E.length)return false;if(ord)return E.every((x,i)=>mi(A[i]||'',x));let used=new Set;return E.every(x=>{let i=A.findIndex((y,j)=>!used.has(j)&&mi(y,x));if(i<0)return false;used.add(i);return true})}function score(a,e,m){let A=norm(a),E=norm(e);if(m==='contains')return A.includes(E)||E.includes(A);if(m==='absent')return A===''||['none','null','not provided','not specified','absent','missing','unknown'].some(x=>A===x||A.includes(x));if(m==='unsupported')return['unsupported','not supported','no evidence','cannot determine','false','no'].some(x=>A===x||A.includes(x));if(m==='set')return same(a,e,false);if(m==='ordered_set')return same(a,e,true);return A===E||item(tj(a))===E}async function ask(key,model,f,q){let hint=q[2]==='set'||q[2]==='ordered_set'?'Return only requested values as an array of strings.':'Return only the final answer.';let prompt=`Use ONLY the provided data. Do not infer absent values. Do not invent fields.${NL}${hint}${NL}${NL}FORMAT: ${f.name}${NL}DATA:${NL}${f.text}${NL}${NL}QUESTION: ${q[0]}${NL}${NL}Return ONLY JSON: {"answer":...}`;let res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json','X-Title':'SCD Arena Mobile'},body:JSON.stringify({model,temperature:0,messages:[{role:'user',content:prompt}]})});if(!res.ok)throw new Error(await res.text());let c=(await res.json())?.choices?.[0]?.message?.content||'';try{return JSON.parse(c.replace('```json','').replace('```','').trim()).answer}catch{return c}}let active='hybrid',battle=[];function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){try{JSON.parse($('raw').value);$('status').textContent='valid JSON';$('status').className='ok'}catch(e){$('status').textContent=e.message;$('status').className='bad';return}let fs=forms(),jt=tok(fs[0].text),f=fs.find(x=>x.id===active)||fs[0];$('cards').innerHTML=fs.map(x=>`<button data-f="${x.id}" class="${active===x.id?'cyan':''}"><b>${x.name}</b><div class="mut">${tok(x.text)} tok · ${((1-tok(x.text)/jt)*100).toFixed(1)}% · ${x.parity}</div></button>`).join('');$('out').textContent=f.text;renderBattle()}function renderBattle(){battle.sort((a,b)=>b.correct/b.total-a.correct/a.total||a.tokens-b.tokens);$('scores').innerHTML=battle.length?'<table>'+battle.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.correct}/${r.total}</td><td>${r.tokens}</td></tr>`).join('')+'</table>':'';$('details').innerHTML=battle.map(r=>`<div class="panel"><b>${r.name} ${r.correct}/${r.total}</b>${r.details.map((d,i)=>`<p class="mut">Q${i+1} ${d.q[2]}: ${esc(d.q[0])}</p><p class="${d.ok?'ok':'bad'}">A: ${esc(JSON.stringify(d.answer))}</p>`).join('')}</div>`).join('')}async function run(){let key=$('key').value.trim();if(!key)return;sessionStorage.setItem('OPENROUTER_API_KEY',key);battle=[];renderBattle();$('run').disabled=true;try{for(let f of forms()){let correct=0,details=[];for(let i=0;i<Q.length;i++){let q=Q[i];$('prog').textContent=f.name+' · Q'+(i+1)+'/'+Q.length;let answer='';try{answer=await ask(key,$('model').value,f,q)}catch(e){answer='ERROR: '+e.message}let ok=score(answer,q[1],q[2]);if(ok)correct++;details.push({q,answer,ok})}battle.push({name:f.name,correct,total:Q.length,tokens:tok(f.text),details});renderBattle()}}finally{$('run').disabled=false;$('prog').textContent=''}}$('raw').value=JSON.stringify(S,null,2);$('key').value=sessionStorage.getItem('OPENROUTER_API_KEY')||'';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');['input','output','battle'].forEach(id=>$(id).classList.toggle('hide',id!==b.dataset.tab));render()});$('cards').onclick=e=>{let b=e.target.closest('[data-f]');if(b){active=b.dataset.f;render()}};$('raw').oninput=render;$('goal').onchange=render;$('sample').onclick=()=>{$('raw').value=JSON.stringify(S,null,2);render()};$('run').onclick=run;$('clear').onclick=()=>{sessionStorage.removeItem('OPENROUTER_API_KEY');$('key').value=''};render();</script></body></html>
